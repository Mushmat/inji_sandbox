## Loaded after certify-default and certify-csvdp-farmer, only by the certify-preauth service.
##
## Same Certify, same database, same signing keys (so the same did:web), but issuing through the
## OpenID4VCI pre-authorized code flow instead of an eSignet login:
##   - POST /pre-authorized-data takes the credential's claims and returns a credential offer that
##     Certify itself generated
##   - Certify is its own authorization server and exchanges the pre-authorized code for a token
##   - the claims come from that request, not from farmer_identity_data.csv, so nothing needs a restart
##
## It has to be a separate instance: a Certify trusts exactly one token issuer and runs one data
## provider plugin, and the main instance needs eSignet + the CSV for Inji Web.

mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin

# Certify is its own authorization server here. The public address is what wallets see;
# the JWKS is fetched from inside the container.
mosip.certify.authorization.url=${mosip.certify.domain.url}
mosip.certify.oauth.issuer=${mosip.certify.domain.url}
mosip.certify.oauth.token-endpoint=${mosip.certify.domain.url}${server.servlet.path}/oauth/token
mosip.certify.oauth.jwks-uri=${mosip.certify.domain.url}${server.servlet.path}/.well-known/jwks.json
mosip.certify.authn.issuer-uri=${mosip.certify.oauth.issuer}
mosip.certify.authn.jwk-set-uri=http://localhost:8090${server.servlet.path}/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.oauth.access-token.audience}' }

# The pre-authorized flow keeps offers in this cache; the defaults don't declare it.
mosip.certify.cache.names=userinfo,vcissuance,certificatedatacache,credentialConfig,renderTemplate,jwks,preAuthCodeCache,asMetadataCache,credentialOfferCache

# Certify 0.14 copies every pre-authorized claim into the access token (its `sub`), photo included.
# MOSIP's 92 KB sample photo makes a ~120 KB Authorization header; Tomcat's default limit is 8 KB.
server.max-http-request-header-size=256KB
