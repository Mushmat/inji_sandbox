# Own project name so this doesn't collide with wallet/ and verify/, which
# also keep their compose files in folders called docker-compose.
name: inji-certify

services:
  database:
    image: 'postgres:15'
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./certify_init.sql:/docker-entrypoint-initdb.d/certify_init.sql
      # Named, so `down` + `up` keeps the database. Without it every fresh
      # container got a new empty database and Certify made new signing keys.
      - certify-db:/var/lib/postgresql/data
    networks:
      - network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  certify:
    image: injistack/inji-certify-with-plugins:0.14.0
    user: root
    restart: unless-stopped
    ports:
      - 8090:8090
    environment:
      - container_user=mosip
      - active_profile_env=default, csvdp-farmer
      - SPRING_CONFIG_NAME=certify
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - enable_certify_artifactory=false
      - download_hsm_client=false
      - mosip_certify_domain_url=http://certify-nginx:80
    volumes:
      - ./config/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./config/certify-csvdp-farmer.properties:/home/mosip/config/certify-csvdp-farmer.properties
      - ./data/CERTIFY_PKCS12:/home/inji/CERTIFY_PKCS12
      - ./config/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv
      - ./config/vp_request_config.json:/home/mosip/config/vp_request_config.json
    networks:
      - network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/v1/certify/.well-known/did.json"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  certify-nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - 8091:80
    volumes:
      - ./certify-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./config/vp_request_config.json:/config/server/vp_request_config.json
    networks:
      - network
    depends_on:
      certify:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/.well-known/did.json"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  network:
    name: mosip_network
    external: true

volumes:
  certify-db:
