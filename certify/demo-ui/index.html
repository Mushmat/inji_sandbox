<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inji Certify — Issuer Demo</title>
<style>
  :root {
    --bg: #f4f5f8;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --border: #e2e4ea;
    --text: #14151a;
    --muted: #6b7080;
    --accent: #3730a3;
    --accent-soft: #eeedfb;
    --ok: #15803d;
    --ok-soft: #ecfdf3;
    --fail: #b91c1c;
    --fail-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(16,17,26,0.04), 0 4px 16px rgba(16,17,26,0.06);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1015;
      --panel: #17181f;
      --panel-2: #1c1e26;
      --border: #2a2c36;
      --text: #eceef3;
      --muted: #9a9ead;
      --accent: #a5b4fc;
      --accent-soft: #23244a;
      --ok: #4ade80;
      --ok-soft: #10281a;
      --fail: #fca5a5;
      --fail-soft: #2c1616;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  .topbar {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .topbar h1 { font-size: 1.25rem; margin: 0 0 2px; letter-spacing: -0.01em; }
  .topbar p { margin: 0; color: var(--muted); font-size: 0.88rem; }

  .layout {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-header h2 { font-size: 0.92rem; margin: 0; font-weight: 600; }
  .panel-body { padding: 16px; }

  /* Identity panel */
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .field input {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.86rem;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button {
    font-family: inherit;
    cursor: pointer;
    border-radius: 8px;
    font-size: 0.86rem;
    border: 1px solid transparent;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-primary {
    background: var(--accent);
    color: white;
    padding: 9px 14px;
    width: 100%;
    font-weight: 600;
  }
  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border-color: var(--accent);
    padding: 9px 14px;
    width: 100%;
  }
  .btn-primary:hover:not(:disabled), .btn-secondary:hover:not(:disabled) { opacity: 0.85; }

  .restart-banner {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 10px;
  }
  .restart-banner.show { display: flex; }
  .spinner {
    width: 13px; height: 13px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Format cards */
  .formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 620px) { .formats { grid-template-columns: 1fr; } }
  .format-card {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    background: var(--panel-2);
    transition: border-color 0.15s, background 0.15s;
  }
  .format-card:hover { border-color: var(--accent); }
  .format-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .format-card .fmt-name { font-weight: 600; font-size: 0.88rem; margin-bottom: 3px; }
  .format-card .fmt-desc { font-size: 0.76rem; color: var(--muted); }

  .run-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }

  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.fail { background: var(--fail-soft); color: var(--fail); }
  .badge.neutral { background: var(--accent-soft); color: var(--accent); }

  /* Steps */
  .step {
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .step-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 0.85rem;
    background: var(--panel-2);
  }
  .step-head .method {
    font-family: ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--muted);
    min-width: 34px;
  }
  .step-head .name { flex: 1; }
  .step-head .chev { color: var(--muted); font-size: 0.75rem; transition: transform 0.15s; }
  .step.expanded .chev { transform: rotate(90deg); }
  .step-detail {
    display: none;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  .step.expanded .step-detail { display: block; }

  pre {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px;
    overflow-x: auto;
    font-size: 0.76rem;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
  }

  .kv { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .kv td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .kv td:first-child { color: var(--muted); width: 40%; font-family: ui-monospace, monospace; font-size: 0.78rem; }
  .kv tr:last-child td { border-bottom: none; }

  .empty { color: var(--muted); font-size: 0.86rem; padding: 8px 0; }
  .section-title { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 14px 0 6px; }
  .section-title:first-child { margin-top: 0; }
  details.raw { margin-top: 10px; }
  details.raw summary { cursor: pointer; font-size: 0.8rem; color: var(--accent); }
</style>
</head>
<body>

<div class="topbar">
  <h1>Inji Certify — Issuer Demo</h1>
  <p>Real OpenID4VCI issuance against a local Certify instance and MOSIP Collab's mock eSignet. Issuer piece only — not the team's playground UI.</p>
</div>

<div class="layout">
  <!-- Identity editor -->
  <div class="panel">
    <div class="panel-header"><h2>Identity used for issuance</h2></div>
    <div class="panel-body" id="identity-body">
      <p class="empty">Loading…</p>
    </div>
  </div>

  <!-- Main column -->
  <div style="display:flex; flex-direction:column; gap:20px;">
    <div class="panel">
      <div class="panel-header"><h2>Credential format</h2></div>
      <div class="panel-body">
        <div class="formats" id="formats"></div>
        <div class="run-row">
          <button class="btn-primary" id="btn-issue" style="width:auto; padding:10px 22px;">Issue credential</button>
          <span id="issue-status"></span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>Protocol steps</h2></div>
      <div class="panel-body" id="steps"><p class="empty">Nothing run yet.</p></div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>Result</h2></div>
      <div class="panel-body" id="result"><p class="empty">Nothing to show yet.</p></div>
    </div>
  </div>
</div>

<script>
const FORMATS = [
  { id: "ldp_vc", name: "JSON-LD", desc: "W3C VC, Ed25519Signature2020" },
  { id: "vc+sd-jwt", name: "SD-JWT", desc: "Selective disclosure, farmerID hidden by default" },
  { id: "mso_mdoc", name: "mDoc / mDL", desc: "ISO 18013-5 mobile driving license, CBOR + COSE" },
];
let selectedFormat = "ldp_vc";
let identityFields = [];

const $ = (sel) => document.querySelector(sel);

function renderFormats() {
  $("#formats").innerHTML = FORMATS.map(f => `
    <div class="format-card ${f.id === selectedFormat ? 'selected' : ''}" data-fmt="${f.id}">
      <div class="fmt-name">${f.name}</div>
      <div class="fmt-desc">${f.desc}</div>
    </div>
  `).join("");
  document.querySelectorAll(".format-card").forEach(el => {
    el.addEventListener("click", () => {
      selectedFormat = el.dataset.fmt;
      renderFormats();
    });
  });
}

async function loadIdentity() {
  const res = await fetch("/api/identity");
  const data = await res.json();
  if (!data.ok) {
    $("#identity-body").innerHTML = `<p style="color:var(--fail)">${data.error}</p>`;
    return;
  }
  identityFields = data.fields;
  const id = data.identity;
  $("#identity-body").innerHTML = `
    ${data.fields.map(f => `
      <div class="field">
        <label>${f}</label>
        <input type="text" data-field="${f}" value="${(id[f] || '').replace(/"/g, '&quot;')}">
      </div>
    `).join("")}
    <button class="btn-primary" id="btn-save-identity">Save &amp; restart issuer</button>
    <div class="restart-banner" id="restart-banner"><span class="spinner"></span> Restarting Certify — takes about a minute…</div>
  `;
  $("#btn-save-identity").addEventListener("click", saveIdentity);
}

async function saveIdentity() {
  const fields = {};
  document.querySelectorAll("#identity-body input[data-field]").forEach(input => {
    fields[input.dataset.field] = input.value;
  });

  $("#btn-save-identity").disabled = true;
  $("#restart-banner").classList.add("show");
  document.querySelectorAll("#identity-body input").forEach(i => i.disabled = true);

  try {
    const res = await fetch("/api/identity", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    const data = await res.json();
    if (!data.ok) {
      alert("Save failed: " + data.error);
    }
  } catch (err) {
    alert("Save failed: " + err);
  } finally {
    $("#restart-banner").classList.remove("show");
    document.querySelectorAll("#identity-body input").forEach(i => i.disabled = false);
    $("#btn-save-identity").disabled = false;
  }
}

function renderSteps(steps) {
  $("#steps").innerHTML = steps.map((s, i) => `
    <div class="step" data-idx="${i}">
      <div class="step-head">
        <span class="badge ${s.ok ? 'ok' : 'fail'}">${s.status}</span>
        <span class="method">${s.method}</span>
        <span class="name">${s.name}</span>
        <span class="chev">&#9656;</span>
      </div>
      <div class="step-detail">
        <pre>${escapeHtml(JSON.stringify(s.response, null, 2))}</pre>
      </div>
    </div>
  `).join("");
  document.querySelectorAll(".step-head").forEach(el => {
    el.addEventListener("click", () => el.closest(".step").classList.toggle("expanded"));
  });
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function kvTable(obj) {
  return `<table class="kv">${Object.entries(obj).map(([k, v]) =>
    `<tr><td>${k}</td><td>${typeof v === 'object' ? escapeHtml(JSON.stringify(v)) : v}</td></tr>`
  ).join("")}</table>`;
}

function renderResult(data) {
  if (!data.ok) {
    const last = data.steps[data.steps.length - 1];
    $("#result").innerHTML = `
      <p><span class="badge fail">FAILED</span> ${data.error}</p>
      <pre>${escapeHtml(JSON.stringify(last ? last.response : {}, null, 2))}</pre>
    `;
    return;
  }

  let html = `<span class="badge neutral">${data.format}</span>`;

  if (data.format === "ldp_vc") {
    const cred = data.credential;
    html += `
      <div class="section-title">Credential subject</div>
      ${kvTable(cred.credentialSubject)}
      <div class="section-title">Proof</div>
      ${kvTable({ type: cred.proof.type, issuer: cred.issuer })}
    `;
  } else if (data.format === "vc+sd-jwt") {
    const d = data.credential_decoded;
    html += `
      <div class="section-title">Payload (vct: ${d.payload.vct})</div>
      ${kvTable(d.payload.credentialSubject)}
      <div class="section-title">Disclosures (selectively disclosable)</div>
      ${d.disclosures.map(dis => `<div style="font-size:0.84rem; margin-bottom:4px;"><b>${dis[1]}</b> = ${dis[2]}</div>`).join("") || '<p class="empty">none</p>'}
    `;
  } else if (data.format === "mso_mdoc") {
    const d = data.credential_decoded;
    const ns = Object.values(d.claims)[0] || {};
    html += `
      <div class="section-title">Document (${d.docType})</div>
      ${kvTable(ns)}
      <div class="section-title">Signature</div>
      ${kvTable({ signed: d.signed })}
    `;
  }

  html += `<details class="raw"><summary>Raw credential</summary><pre>${escapeHtml(
    typeof data.credential === 'string' ? data.credential : JSON.stringify(data.credential, null, 2)
  )}</pre></details>`;

  $("#result").innerHTML = html;
}

async function issue() {
  $("#btn-issue").disabled = true;
  $("#issue-status").textContent = "Running…";
  $("#steps").innerHTML = '<p class="empty">Running…</p>';
  $("#result").innerHTML = '<p class="empty">Running…</p>';

  try {
    const res = await fetch("/api/issue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ format: selectedFormat }),
    });
    const data = await res.json();
    renderSteps(data.steps || []);
    renderResult(data);
    $("#issue-status").textContent = data.ok ? "Done" : "Failed";
  } catch (err) {
    $("#steps").innerHTML = `<p style="color:var(--fail)">Request failed: ${err}</p>`;
    $("#issue-status").textContent = "Failed";
  } finally {
    $("#btn-issue").disabled = false;
  }
}

$("#btn-issue").addEventListener("click", issue);
renderFormats();
loadIdentity();
</script>
</body>
</html>
