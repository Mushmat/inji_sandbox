name: Tests

# Everything that runs without the Inji stack: the Playground's backend and frontend tests,
# and the verifier's offline suite. The nightly workflow covers the live services.
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playground/bff/requirements.txt
      - run: pip install -r playground/bff/requirements.txt
      - name: Playground backend (verifier scenarios over real HTTP, rules, report)
        working-directory: playground/bff/tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Present & verify, offline suite
        working-directory: verify/scripts
        env:
          ALLOW_REMOTE_CONTEXTS: "0"
        run: python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
